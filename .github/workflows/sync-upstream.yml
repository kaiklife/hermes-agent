name: sync-upstream

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kai-fixes
          fetch-depth: 0

      - name: Merge upstream/main into kai-fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "kai-sync-bot"
          git config user.email "bot@kaiklife.dev"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main
          # GITHUB_TOKEN 是 App 令牌，永远无权 push .github/workflows/** 的改动
          # （refusing to allow a GitHub App to create or update workflow ... without `workflows` permission）。
          # 所以合并后把该目录整体还原成我们这边的版本：改过/新增/删掉的一律剥掉，其余照常合。
          if git merge --no-commit --no-edit upstream/main; then
            git reset -q HEAD -- .github/workflows/
            git checkout -- .github/workflows/
            git clean -fdq .github/workflows/
            git commit --no-edit
            if ! git push origin HEAD:kai-fixes; then
              echo "::error::push rejected — check whether the diff still touches .github/workflows/**"
              exit 1
            fi
            echo "Upstream merged into kai-fixes (our workflow files kept)"
          else
            git merge --abort
            TITLE="sync conflict: kaiklife/hermes-agent (kai-fixes)"
            if [ "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq 'length')" != "0" ]; then
              echo "open conflict issue already exists, skip"
            else
              gh issue create --title "$TITLE" --body "Upstream has new commits conflicting with kai-fixes; auto-merge aborted. Resolve manually (fetch, merge, fix conflicts, push kai-fixes), then close this issue."
            fi
            exit 1
          fi
